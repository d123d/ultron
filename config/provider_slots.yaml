# Two model slots per provider: `top` (strongest model it serves) and `cheap` (free or cheapest good one).
# Use them anywhere a tier is accepted: `nvidia:top`, `openrouter:cheap`; `*:top` / `*:cheap` = every
# usable free/flat provider's slot, best score first (job lists end with these so work never runs dry).
# A value is a model id on that provider, or a registry tier id (CLI/subscription providers).
# A provider not listed here uses its first tier for both slots.
# Scores: Artificial Analysis Intelligence Index, snapshot 2026-11-12
#   https://modelcap.ai/benchmarks/aa-intelligence-index
#   https://www.benchleader.com/benchmarks/aa_intelligence_index_v5
# <kind>_cost: metered = that slot spends money although the provider has free models; never in *:top/*:cheap.
# 0 = not scored there (ranked last within its cost class).
