  - {from: utility,   to: nim-minimax,     weight: 0.5}
  - {from: main,      to: nim-step,        weight: 0.4}
  - {from: main,      to: nim-glm,         weight: 0.5}
  - {from: strata,    to: nim-lightning,   weight: 0.6}
  - {from: zen,       to: go,              weight: 0.5}
