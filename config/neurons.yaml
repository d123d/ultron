# Neurons = worker agents + model tiers + leader nodes grouped into brain regions.
# threshold: activation needed to fire.
# refractory_ticks: rest after firing (cooldown, in propagation ticks).
# receptive_field: capabilities this neuron responds to.
neurons:
  claude:
    region: prefrontal
    kind: agent
    threshold: 0.70
    refractory_ticks: 2
    receptive_field: [code, edit, shell, text, review, research]
    notes: "Operator-class Claude worker (opt-in)."
  codex:
    region: prefrontal
    kind: agent
    threshold: 0.55
    refractory_ticks: 2
    receptive_field: [code, edit, shell, text, review]
    notes: "Strong coder/reviewer (gpt-6-astra)."
  muse-code:
    region: prefrontal
    kind: agent
    threshold: 0.60
    refractory_ticks: 2
    receptive_field: [code, edit, shell, text, review, research]
    notes: "Meta Muse Spark coding agent; recruited end-to-end between codex and claude."
  claude-leader:
    region: prefrontal
    kind: tier
    threshold: 0.75
    refractory_ticks: 2
    receptive_field: [leader, plan, review, research, text]
    notes: "Claude Fable 5.2 low-effort leader (priority 1 when off cooldown)."
