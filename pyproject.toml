[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron"
version = "0.5.0"
description = "Ultron — brain-structured AI neural network: AI Fleet workers and model tiers as neurons, no central dispatcher."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.0,<2",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
brain = "ai_neural_network.cli:main"
ultron = "ai_neural_network.cli:main"
brain-mcp = "ai_neural_network.mcp_server:main"
ultron-mcp = "ai_neural_network.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_neural_network = ["workers.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
