    model: "@cf/openai/gpt-oss-120b"
    key_env: CLOUDFLARE_API_TOKEN
    cost: metered
    catalog: cloudflare-workers-ai
    notes: Cloudflare Workers AI via adapter ({account} resolved from CLOUDFLARE_ACCOUNT_ID at call time).
    fallback: [groq-api, openrouter-ultra]
  openai-embed:
    base_url: https://api.openai.com/v1
    model: text-embedding-3-small
    key_env: OPENAI_API_KEY
    cost: metered
    catalog: openai
    notes: Embedding tier for semantic memory (brain remember/recall), not chat. Shares the OpenAI key.
    fallback: [gemini-embed]
  gemini-embed:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-embedding-2
    key_env: GEMINI_API_KEY
    cost: metered
    catalog: google
    notes: Embedding tier (fallback for openai-embed) via Google AI Studio OpenAI-compat /embeddings.
