defaults:
  timeout_s: 1800
  quota_patterns:
  - rate limit
  - rate_limit
  - quota
  - usage limit
  - '429'
  - insufficient_quota
  - exceeded your
  - IneligibleTier
  - no_access
  - credit balance
  cooldown_s: 3600
workers:
  opencode:
    kind: agent
    control: acpx
    acpx_agent: opencode
    cost: free
    rank: 10
    capabilities:
    - code
    - edit
    - shell
    - text
    - local
    notes: OpenCode, free Zen model (mimo-v2.6-flash-free). Default for bulk coding/editing.
      Smoke 9-28 s. On local Flash-Next (Strata gateway) 2/2 coding tasks in 185 s and 154 s (2026-11-06).
    probe:
    - opencode
    - --version
  codex:
    kind: agent
    control: acpx
    acpx_agent: codex
    cost: flat
    rank: 20
    enabled: true
    capabilities:
    - code
    - edit
    - shell
    - text
    - review
    notes: Codex CLI via codex-acp, ChatGPT subscription. Default model gpt-5.6-sol
      (AA 47; effort xhigh since 2026-10-12). Strong but slow on big tasks; subscription
      cooldowns.
    probe:
    - codex
    - --version
  agy:
    kind: agent
    control: agy
    cost: flat
    rank: 30
    capabilities:
    - code
    - edit
    - shell
    - text
    - research
    notes: Antigravity CLI (agy -p --output-format json). Google account. Replaces
      Gemini CLI (cut off 2026-06-18). Smoke ~40 s.
    probe:
    - agy
    - --version
  pi:
    kind: agent
    control: acpx
    acpx_agent: pi
    cost: free
    rank: 50
    resources: []  # cloud default (OpenRouter Nemotron); local Strata only when asked
    max_parallel: 1
    capabilities:
    - code
    - edit
    - shell
    - text
    - local
    notes: pi coding agent; default openrouter nemotron free. Preferred for local Flash-Next work (capability local)
      - on the Strata gateway it solved 2/2 coding tasks in 14 s and 11 s vs OpenCode 185 s and 154 s (2026-11-06).
    probe:
    - pi
    - --version
  claude:
    kind: agent
    control: claude
    cost: claude
    rank: 90
    opt_in: true
    enabled: false
    capabilities:
    - code
    - edit
    - shell
    - text
    - review
    - research
    notes: Claude Code headless. Operator by default; worker only with --allow-claude
      and a budget cap.
    probe:
    - claude
    - --version
  github:
    kind: agent
    control: command
    cost: flat
    rank: 35
    capabilities:
    - code
    - edit
    - shell
    - text
    - review
    - research
    timeout_s: 900
    notes: GitHub Copilot CLI headless worker (copilot -p).
    probe:
    - copilot
    - --version
    argv:
    - copilot
    - -p
    - "Read the task instructions in {prompt_file} and complete them in {cwd}. End with FLEET_RESULT JSON."
    - --allow-all-tools  # headless -p denies every tool needing approval otherwise
    - --add-dir
    - "{cwd}"
  muse-code:
    kind: agent
    control: command
    cost: flat
    rank: 60
    enabled: true  # Muse Code CLI 1.4.20 installed 2026-11-14 (dev.meta.ai/install.ps1); headless = `muse exec`
    capabilities:
    - code
    - edit
    - shell
    - text
    - review
    - research
    timeout_s: 900
    notes: Meta Muse Spark coding agent (muse CLI). Registry entry added 2026-11-14 (Ultron review) so the muse-code neuron can actually execute, not just fire in traces.
    probe:
    - muse
    - --version
    argv:
    - muse
    - exec
    - --disable-approval  # headless cannot answer prompts; sandbox stays on
    - --max-model-steps
    - "200"
    - --workspace
    - "{cwd}"
    - "Read the task instructions in {prompt_file} and complete them in {cwd}. End with FLEET_RESULT JSON."
  openhuman:
    kind: agent
    control: command
    cost: flat
    rank: 45
    capabilities:
    - text
    - schedule
    - unattended
    - leader
    - comm
    timeout_s: 900
    notes: OpenHuman Second in Command (unattended/scheduled rhythm), reached through its durable card queue
      (openhuman-ops oh_msg.py send; there is no openhuman CLI). Fixed 2026-11-14 - the old argv called a
      binary that does not exist.
    probe:
    - py
    - "-3.14"
    - C:\AI\projects\openhuman-ops\scripts\oh_msg.py
    - list
    - --n
    - "1"
    argv:
    - py
    - "-3.14"
    - C:\AI\projects\openhuman-ops\scripts\oh_msg.py
    - send
    - "Read the task instructions in {prompt_file} and complete them in {cwd}. End with FLEET_RESULT JSON."
    - --name
    - ultron
    - --channel
    - none
tiers:
  tiny:
    base_url: http://127.0.0.1:47831/v1
    model: qwen3.8-abliterated
    cost: free
    notes: Strata desktop app reached through its app gateway :47831 (route A/B 2026-11-05), alias qwen3.8-abliterated, keyless on 127.0.0.1; parallel 1, stopped during ComfyUI renders via strata-gen
  local:
    base_url: http://127.0.0.1:47831/v1
    model: qwen3.8-abliterated
    cost: free
    notes: Strata desktop app reached through its app gateway :47831 (route A/B 2026-11-05), alias qwen3.8-abliterated, keyless on 127.0.0.1; parallel 1, stopped during ComfyUI renders via strata-gen
  openrouter-ultra:
    base_url: https://openrouter.ai/api/v1
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    key_env: OPENROUTER_API_KEY
    cost: free
    catalog: openrouter
    notes: "Nemotron 3 Ultra 550B free (1M ctx, reasoning) via OpenRouter — daily quota applies"
  openrouter-gemma:
    base_url: https://openrouter.ai/api/v1
    model: google/gemma-4-31b-it:free
    key_env: OPENROUTER_API_KEY
    cost: free
    catalog: openrouter
    notes: "Gemma 4 31B IT free (1M ctx, reasoning) via OpenRouter — daily quota applies"
  utility:
    base_url: https://ollama.com/v1
    model: gpt-oss:120b
    key_env: OLLAMA_API_KEY
    cost: free
    catalog: ollama-cloud
    notes: gpt-oss 120B on the Ollama Cloud free plan. fleet eval 2026-11-06 - 14/16 at 3.9 s median; the old pick Nemotron 3.5 Lightning (NIM) 3/16, timing out at 180 s. Local Strata last (skipped during a timed test)
